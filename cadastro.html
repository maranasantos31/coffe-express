<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cafeteria Express</title>
    <link rel="stylesheet" href="login.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Playfair+Display:wght@600&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="container">
            <h1 class="logo">Cafeteria Express</h1>
            <nav>
                <ul class="menu">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="cardapio.html">Cardápio</a></li>
                    <li><a href="carrinho.html">Carrinho</a></li>
                    <li><a href="filial.html">Filiais</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="login-container">
        <div class="login-box">
            <h1>Cafeteria Express</h1>
            <p class="slogan">Cadastre-se e saboreie o melhor café☕</p>

            <form>
                <label for="usuario">Nome de usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu nome de usuário" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="Digite seu telefone" required>

                <label for="cep">CEP</label>
                <input type="text" id="cep" placeholder="Digite seu CEP" required>

                <label for="estado">Estado</label>
                <input type="text" id="estado" placeholder="Digite seu estado" required>

                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" placeholder="Digite sua cidade" required>

                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" placeholder="Digite seu bairro" required>

                <label for="endereco">Rua</label>
                <input type="text" id="endereco" placeholder="Rua e número" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" required>

               <button type="submit">Cadastrar</button>
            </form>

        </div>
    </main>

    <footer>
        <p>© Cafeteria Express 2025, feito com amor e muito café ☕</p>
    </footer>
    
<script src="cadastro.js"></script>
</body>
</html>
